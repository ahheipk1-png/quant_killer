name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sanity:
    name: Repo sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files exist
        run: |
          for f in README.md LICENSE CLAUDE.md AGENTS.md INSTALL.md \
                   contracts/rng-spec.md contracts/schema/request.schema.json \
                   contracts/schema/response.schema.json; do
            [ -f "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          echo "All required files present."
      - name: Schemas and vectors are valid JSON
        run: |
          python3 -c "import json,glob; [json.load(open(p)) for p in glob.glob('contracts/schema/*.json')+glob.glob('contracts/vectors/*.json')]; print('JSON OK')"

  python:
    name: Python
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
        working-directory: python

  csharp:
    name: C#
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test
        working-directory: csharp

  rust:
    name: Rust
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
        working-directory: rust

  cpp:
    name: C++
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        working-directory: cpp
      - name: Build
        run: cmake --build build --config Release
        working-directory: cpp
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        working-directory: cpp

  web-lab:
    name: Browser lab (Node suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run all Node test suites
        working-directory: web-lab
        run: |
          for t in smoke-test.cjs exotic-test.cjs advanced-test.cjs pde-test.cjs \
                   path-distribution-test.cjs pricing-regression-test.cjs \
                   portfolio-test.cjs volatility-test.cjs; do
            echo "=== $t ==="
            node "$t"
          done

  # Builds every CLI itself (matrix jobs run in isolated workspaces, so their
  # build outputs don't carry over) then runs scripts/test_crosslang.py,
  # which invokes each live CLI binary as a subprocess on every vector case
  # and diffs the JSON responses pairwise. Stronger than each language's own
  # vector-file test: this also exercises process invocation and JSON
  # encode/decode, not just the in-process model functions.
  crosslang:
    name: Cross-language CLI parity
    runs-on: ubuntu-latest
    needs: [python, csharp, rust, cpp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: dtolnay/rust-toolchain@stable
      - run: dotnet build src/QuantKiller.Cli -c Release --nologo
        working-directory: csharp
      - run: cargo build --release -p quantkiller-cli
        working-directory: rust
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --config Release
        working-directory: cpp
      - run: python scripts/test_crosslang.py
