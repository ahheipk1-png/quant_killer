[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantkiller"
version = "0.1.0"
description = "Free, open, verified derivatives pricing — Python reference engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michael Cheng" }]
keywords = ["derivatives", "options", "black-scholes", "quantitative-finance", "pricing"]
classifiers = [
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.scripts]
quantkiller = "quantkiller.cli:main"

[project.urls]
Homepage = "https://github.com/ahheipk1-png/quant_killer"

[tool.setuptools.packages.find]
include = ["quantkiller*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
